# permissions for end users to view sentryclusters.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sentry-operator
    app.kubernetes.io/managed-by: kustomize
  name: sentrycluster-viewer-role
rules:
- apiGroups:
  - sentry.sentry.io
  resources:
  - sentryclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sentry.sentry.io
  resources:
  - sentryclusters/status
  verbs:
  - get
